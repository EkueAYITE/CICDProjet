name: CI - Pull Request Validation

on:
  pull_request:
    branches: [ staging ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Linter le code
        run: npm run lint

      - name: Compiler TypeScript
        run: npm run build

      - name: Lancer les tests unitaires
        run: npm test

      - name: Récupérer la version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build et push de l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cicd-api:${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/cicd-api:latest

2. Créer le dépôt sur Docker Hub
Sur hub.docker.com, cliquer sur Create Repository
Nommer le dépôt cicd-api (ou garder ce nom dans le workflow)
